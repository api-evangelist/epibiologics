name: EpiBiologics
description: 'EpiBiologics is a clinical-stage biotechnology company based in San Mateo, California,
  developing bispecific antibodies for directed extracellular protein degradation. Its proprietary
  EpiTAC platform leverages an atlas of 270+ degradation-inducing cell-surface receptors to build
  tissue-selective therapies that degrade disease-causing proteins while sparing healthy tissue,
  targeting cancer, autoimmune, and other serious diseases. The company dosed its first patient with
  EPI-326 (an EGFR-driven solid-tumor bispecific) in a Phase 1 study in April 2026 and closed a $107M
  Series B round in January 2026. Backed by GV, EpiBiologics was added to the API Evangelist network as
  a portfolio-lead profile; it publishes a corporate website but no public developer/API surface.'
